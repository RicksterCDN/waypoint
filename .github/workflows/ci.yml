name: Consolidated CI (disabled)

on:
  workflow_dispatch:

jobs:
  disabled:
    name: Disabled for public preview
    runs-on: ubuntu-latest
    steps:
      - run: echo "CI is temporarily disabled while the public preview validation path is hardened."

  # The validation jobs below are kept as the intended CI shape, but disabled for
  # the early public preview so repository publication is not blocked by setup drift.
  waypoint-api:
    name: Waypoint API
    if: ${{ false }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/waypoint/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-extras
      - run: uv run ruff check app/
      - run: uv run mypy app/
      - run: uv run pytest --tb=short -v

  waypoint-web:
    name: Waypoint web
    if: ${{ false }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/waypoint/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/waypoint/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  corpus:
    name: Corpus seed
    if: ${{ false }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modules/corpus
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run python -m compileall -q src
      - run: uv run ledgerfield generate-waypoint-seed
      - run: python -m json.tool data/waypoint/waypoint-seed.json > /dev/null

  agents-static:
    name: Agent static contracts
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall -q modules/agents/agents modules/agents/scripts modules/agents/evals
      - run: python -m compileall -q apps/waypoint/integrations/agents

  evals:
    name: Evaluation tooling
    if: ${{ false }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modules/evals
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run caliber telemetry backfill-plan --json
      - run: uv run ruff check .

  deploy-tooling:
    name: Deploy tooling
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n tools/deploy/scripts/*.sh
