name: Deploy

# One-click umbrella deploy for the keystone pharma demo. ZERO manual configuration:
# the ONLY thing a human provides is the OIDC bootstrap (AZURE_* on keystone, set once by
# scripts/oidc.sh). Everything else — resource names, API keys, Postgres password, the MSAL
# app registration, cross-stage endpoints, and the change-detection state — is discovered,
# derived, provisioned, or generated by this workflow and flows job-to-job as typed outputs.
#
#   discover -> preflight
#            -> provision-keyvault ----\
#            -> ensure-msal ------------+-> forge-deploy -> waypoint-deploy
#   ledgerfield-seed -------------------/    |           -> ledgerfield-onelake-upload
#                                            \-> ledgerfield-contracts-kb-upload (parallel)
#                                                        -> seed-import -> wire (incl. MSAL pass 2)
#   record-state (always; persists state as Azure RG tags)
#
# A `preflight` job inspects existing Azure/Fabric/Foundry state + repo ref changes and emits
# per-stage booleans that gate every downstream job; every stage is ALSO idempotent so a
# re-run is always safe. workflow_dispatch overrides (force_all / force_fabric / only / skip)
# let an operator override the detection when needed.
on:
  workflow_dispatch:
    # NOTE: GitHub requires a LITERAL ref on reusable-workflow `uses:` lines, so the
    # downstream calls below are pinned to `@main`. The *_ref inputs drive preflight
    # change-detection (resolve ref -> SHA) and the local `make` path only.
    inputs:
      azd_env_name:
        description: "Waypoint azd/environment label (passthrough + live-discovery hint; keystone-owned names are fixed)"
        type: string
        default: waypoint
      ledgerfield_ref:
        description: "ledgerfield git ref for change-detection (uses is pinned to main)"
        type: string
        default: main
      forge_ref:
        description: "forge git ref for change-detection (uses is pinned to main)"
        type: string
        default: main
      waypoint_ref:
        description: "Waypoint git ref for change-detection (uses is pinned to main)"
        type: string
        default: main
      force_all:
        description: Run every stage regardless of change/existence detection
        type: boolean
        default: false
      force_fabric:
        description: Force the Microsoft Fabric OneLake (re)provision even when unchanged
        type: boolean
        default: false
      only:
        description: "Run ONLY this stage (+ required upstreams). One of: ledgerfield forge waypoint onelake_upload contracts_kb seed wire. Empty = all."
        type: string
        default: ""
      skip:
        description: "Comma-separated stages to force-skip (e.g. forge,wire)"
        type: string
        default: ""

permissions:
  id-token: write   # Azure OIDC + Microsoft Graph (MSAL app-reg ensure)
  contents: read

concurrency:
  group: keystone-deploy
  cancel-in-progress: false

jobs:
  # Discovery / conventions. Derives the keystone-CHOSEN names (Key Vault, Fabric) and
  # DISCOVERS the tool-generated existing topology (forge/waypoint resource groups, Foundry
  # endpoint, App Insights id, Postgres server, MSAL client id, deploy-SP object id) so every
  # later job runs against the REAL caldova environment, not assumptions. No user input.
  discover:
    runs-on: ubuntu-latest
    outputs:
      env_name: ${{ steps.d.outputs.env_name }}
      forge_rg: ${{ steps.d.outputs.forge_rg }}
      waypoint_rg: ${{ steps.d.outputs.waypoint_rg }}
      state_rg: ${{ steps.d.outputs.state_rg }}
      kv_name: ${{ steps.d.outputs.kv_name }}
      foundry_endpoint: ${{ steps.d.outputs.foundry_endpoint }}
      foundry_project_url: ${{ steps.d.outputs.foundry_project_url }}
      app_insights_resource_id: ${{ steps.d.outputs.app_insights_resource_id }}
      log_analytics_workspace_name: ${{ steps.d.outputs.log_analytics_workspace_name }}
      log_analytics_resource_group: ${{ steps.d.outputs.log_analytics_resource_group }}
      postgres_server_name: ${{ steps.d.outputs.postgres_server_name }}
      msal_client_id: ${{ steps.d.outputs.msal_client_id }}
      sp_object_id: ${{ steps.d.outputs.sp_object_id }}
      fabric_capacity_name: ${{ steps.d.outputs.fabric_capacity_name }}
      fabric_sku_name: ${{ steps.d.outputs.fabric_sku_name }}
      fabric_workspace_name: ${{ steps.d.outputs.fabric_workspace_name }}
      fabric_lakehouse_name: ${{ steps.d.outputs.fabric_lakehouse_name }}
      fabric_corpus_prefix: ${{ steps.d.outputs.fabric_corpus_prefix }}
      fabric_account_url: ${{ steps.d.outputs.fabric_account_url }}
      fabric_admin_members_json: ${{ steps.d.outputs.fabric_admin_members_json }}
      ledgerfield_seed_uri: ${{ steps.d.outputs.ledgerfield_seed_uri }}
    steps:
      - uses: actions/checkout@v4
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Discover topology + derive names
        id: d
        env:
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZD_ENV_NAME: ${{ inputs.azd_env_name }}
        run: bash scripts/discover.sh

  # Preflight — change/existence detection. Resolves each repo ref -> SHA, compares to the
  # SHAs recorded on the last successful run (stored as AZURE RESOURCE GROUP TAGS, since the
  # workflow GITHUB_TOKEN can't write repo vars/secrets), probes live Azure/Fabric/Foundry
  # state, and emits per-stage booleans consumed by every job's `if:`. Honors the
  # workflow_dispatch force_all/force_fabric/only/skip overrides.
  preflight:
    needs: discover
    runs-on: ubuntu-latest
    outputs:
      needs_keygen: ${{ steps.detect.outputs.needs_keygen }}
      needs_ledgerfield: ${{ steps.detect.outputs.needs_ledgerfield }}
      needs_forge: ${{ steps.detect.outputs.needs_forge }}
      needs_waypoint: ${{ steps.detect.outputs.needs_waypoint }}
      needs_fabric: ${{ steps.detect.outputs.needs_fabric }}
      needs_onelake_upload: ${{ steps.detect.outputs.needs_onelake_upload }}
      needs_contracts_kb: ${{ steps.detect.outputs.needs_contracts_kb }}
      needs_seed: ${{ steps.detect.outputs.needs_seed }}
      needs_wire: ${{ steps.detect.outputs.needs_wire }}
      ledgerfield_sha: ${{ steps.detect.outputs.ledgerfield_sha }}
      forge_sha: ${{ steps.detect.outputs.forge_sha }}
      waypoint_sha: ${{ steps.detect.outputs.waypoint_sha }}
      recorded_onelake_workspace: ${{ steps.detect.outputs.recorded_onelake_workspace }}
      recorded_contracts_kb_storage: ${{ steps.detect.outputs.recorded_contracts_kb_storage }}
      recorded_web_fqdn: ${{ steps.detect.outputs.recorded_web_fqdn }}
      recorded_api_fqdn: ${{ steps.detect.outputs.recorded_api_fqdn }}
    steps:
      - uses: actions/checkout@v4
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Detect what needs to run
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LEDGERFIELD_REF: ${{ inputs.ledgerfield_ref }}
          FORGE_REF: ${{ inputs.forge_ref }}
          WAYPOINT_REF: ${{ inputs.waypoint_ref }}
          FORCE_ALL: ${{ inputs.force_all }}
          FORCE_FABRIC: ${{ inputs.force_fabric }}
          ONLY: ${{ inputs.only }}
          SKIP: ${{ inputs.skip }}
          # State RG + Key Vault + Fabric capacity all come from discovery (no manual vars).
          # preflight reads the RG tags + KV reader key + capacity existence from these.
          STATE_RG: ${{ needs.discover.outputs.state_rg }}
          WAYPOINT_RG: ${{ needs.discover.outputs.waypoint_rg }}
          KV_NAME: ${{ needs.discover.outputs.kv_name }}
          FABRIC_CAPACITY_NAME: ${{ needs.discover.outputs.fabric_capacity_name }}
        run: bash scripts/preflight.sh

  # Stage 0a — provision the Key Vault and GENERATE-ONCE-THEN-READ the shared x-api-keys
  # (writer/reader/admin) + the Postgres app password as KV secrets. Replaces any user-set
  # seed/secret: the deploy SP (Contributor + UAA via OIDC) provisions the vault, self-grants
  # data-plane RBAC, and writes each secret only if absent — so values are STABLE across runs.
  # Always runs (cheap, idempotent) so downstream deploys always have keys, even under only=/skip=.
  provision-keyvault:
    needs: discover
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    outputs:
      writer_api_key: ${{ steps.kv.outputs.writer_api_key }}
      reader_api_key: ${{ steps.kv.outputs.reader_api_key }}
      admin_api_key: ${{ steps.kv.outputs.admin_api_key }}
      postgres_app_password: ${{ steps.kv.outputs.postgres_app_password }}
      api_keys: ${{ steps.kv.outputs.api_keys }}
      kv_name: ${{ steps.kv.outputs.kv_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Ensure Key Vault + secrets
        id: kv
        env:
          KV_NAME: ${{ needs.discover.outputs.kv_name }}
          STATE_RG: ${{ needs.discover.outputs.state_rg }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
          SP_OBJECT_ID: ${{ needs.discover.outputs.sp_object_id }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
        run: bash scripts/keyvault.sh

  # Stage 0b — ensure the waypoint Entra (MSAL) app registration: create-if-missing,
  # read-if-exists, ensure the Waypoint.Read/Write/Admin app roles (live discovery showed
  # appRoles EMPTY), ensure the identifier uri, and emit the MSAL identity values for the
  # waypoint-deploy inputs. The web-FQDN redirect URI is set in a second pass post-deploy.
  ensure-msal:
    needs: discover
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    outputs:
      msal_tenant_id: ${{ steps.msal.outputs.msal_tenant_id }}
      msal_client_id: ${{ steps.msal.outputs.msal_client_id }}
      msal_writer_app_role: ${{ steps.msal.outputs.msal_writer_app_role }}
      msal_reader_app_role: ${{ steps.msal.outputs.msal_reader_app_role }}
      msal_admin_app_role: ${{ steps.msal.outputs.msal_admin_app_role }}
      msal_allowed_app_ids: ${{ steps.msal.outputs.msal_allowed_app_ids }}
      api_app_id_uri: ${{ steps.msal.outputs.api_app_id_uri }}
      api_default_scope: ${{ steps.msal.outputs.api_default_scope }}
    steps:
      - uses: actions/checkout@v4
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Ensure MSAL app registration (pass 1)
        id: msal
        env:
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          MSAL_CLIENT_ID: ${{ needs.discover.outputs.msal_client_id }}
        run: bash scripts/msal.sh ensure

  # Stage 1 — generate + publish the demo corpus seed (reusable workflow in ledgerfield).
  ledgerfield-seed:
    needs: preflight
    if: ${{ needs.preflight.outputs.needs_ledgerfield == 'true' }}
    uses: caldova/waypoint/.github/workflows/waypoint-seed.yml@main
    with:
      source_ref: ${{ inputs.ledgerfield_ref }}
    secrets:
      REPO_TOKEN: ${{ secrets.KEYSTONE_REPO_TOKEN }}

  # Stage 2 — provision shared infra + deploy the Foundry agents via forge's reusable
  # workflow (idempotent azd provision+deploy). The writer/reader keys come from Key Vault.
  forge-deploy:
    needs: [preflight, provision-keyvault]
    if: ${{ always() && needs.preflight.outputs.needs_forge == 'true' && !cancelled() && needs.provision-keyvault.result == 'success' }}
    uses: caldova/waypoint/.github/workflows/deploy.yml@main
    with:
      source_ref: ${{ inputs.forge_ref }}
      agent: all
      provision: true
      key_vault_name: ${{ needs.provision-keyvault.outputs.kv_name }}
      # The aggregator + read agents need the Waypoint API base URL seeded into the
      # forge azd env so agent.yaml ${WAYPOINT_API_BASE_URL} resolves (an empty value
      # drops the waypoint_record_assurance write tool). waypoint-deploy runs AFTER
      # forge-deploy (it consumes forge's project_endpoint), so its live api_fqdn
      # output is NOT available here. The Waypoint API FQDN is stable across Aspire
      # redeploys, so source it from the recorded keystone_api_fqdn RG tag
      # (preflight). Empty only in a truly greenfield tenant with no api yet; on the
      # first run the seed-import/wire stages still record it for the next run.
      waypoint_api_base_url: ${{ needs.preflight.outputs.recorded_api_fqdn != '' && format('https://{0}', needs.preflight.outputs.recorded_api_fqdn) || '' }}
      # Waypoint WEB app URL for the assurance-analyst Adaptive Card invoice
      # deep-links (agent.yaml ${WAYPOINT_APP_BASE_URL}). Same story as the API
      # URL above: waypoint-deploy runs AFTER forge-deploy, but the web Container
      # App FQDN is stable across redeploys, so source it from the recorded
      # keystone_web_fqdn RG tag (preflight). Empty only on a greenfield first
      # run — links self-heal next run; forge also falls back to its own repo var
      # for standalone runs. An empty value just renders card rows without links.
      waypoint_app_base_url: ${{ needs.preflight.outputs.recorded_web_fqdn != '' && format('https://{0}', needs.preflight.outputs.recorded_web_fqdn) || '' }}
      # API-key auth (x-api-key) is used for the agent->Waypoint write path, so no
      # Entra scope is needed. Left empty intentionally.
      waypoint_api_scope: ''
      # Reconcile Foundry agent drift on every umbrella deploy: delete agents the
      # forge repo no longer declares (e.g. retired hosted *-expert agents that
      # became prompt agents). forge's reconcile refuses to act on an empty
      # expected set, so this can't nuke the project. Keeps the one-click deploy
      # self-healing instead of accumulating orphaned agents.
      prune_unmanaged_agents: true
    secrets:
      REPO_TOKEN: ${{ secrets.KEYSTONE_REPO_TOKEN }}
      GH_MCP_PAT: ${{ secrets.GH_MCP_PAT }}
      WAYPOINT_WRITER_API_KEY: ${{ needs.provision-keyvault.outputs.writer_api_key }}
      WAYPOINT_READER_API_KEY: ${{ needs.provision-keyvault.outputs.reader_api_key }}

  # Stage 3 — deploy the Aspire app (FastAPI API + React web + Postgres) via waypoint's
  # reusable workflow. ZERO manual config: keystone PASSES every computed value as a
  # workflow_call INPUT/secret — it populates NO keystone repo variables. Values come from
  # discover (names/topology), provision-keyvault (keys + pg password), ensure-msal (identity),
  # and forge-deploy (Foundry project endpoint). fabric_provision_enabled is gated on
  # preflight's needs_fabric (skip-on-unchanged).
  #
  # Input names below are the FINAL waypoint workflow_call contract (merged to waypoint@main,
  # PR #6): 22 pass-through inputs, each `inputs.X != '' && inputs.X || vars.WAYPOINT_X` on the
  # waypoint side — so keystone PASSES computed values and empties fall back to waypoint's own
  # repo vars. The contract is final at 22 (verified against waypoint origin/main).
  waypoint-deploy:
    needs: [discover, preflight, provision-keyvault, ensure-msal, forge-deploy]
    if: ${{ always() && needs.preflight.outputs.needs_waypoint == 'true' && !cancelled() && needs.provision-keyvault.result == 'success' && needs.ensure-msal.result == 'success' && (needs.forge-deploy.result == 'success' || needs.forge-deploy.result == 'skipped') }}
    uses: caldova/waypoint/.github/workflows/deploy.yml@main
    with:
      source_ref: ${{ inputs.waypoint_ref }}
      environment: ${{ needs.discover.outputs.env_name }}
      api_key_auth_enabled: true
      key_vault_name: ${{ needs.provision-keyvault.outputs.kv_name }}
      fabric_provision_enabled: ${{ needs.preflight.outputs.needs_fabric == 'true' }}
      # --- MSAL identity (from ensure-msal). redirect_uri MUST NOT be empty when a web already
      # exists: a deployed waypoint has MSAL enabled by default and its web throws if the redirect
      # is missing. Source it from the discovered current web FQDN (primary), else the recorded
      # web FQDN RG tag (fallback); empty only in a truly greenfield tenant with no web yet. The
      # wire job (pass 2) additionally unions the freshly-deployed web FQDN into the app reg. ---
      msal_tenant_id: ${{ needs.ensure-msal.outputs.msal_tenant_id }}
      msal_client_id: ${{ needs.ensure-msal.outputs.msal_client_id }}
      msal_redirect_uri: ${{ needs.discover.outputs.msal_redirect_uri != '' && needs.discover.outputs.msal_redirect_uri || (needs.preflight.outputs.recorded_web_fqdn != '' && format('https://{0}/login', needs.preflight.outputs.recorded_web_fqdn) || '') }}
      msal_writer_app_role: ${{ needs.ensure-msal.outputs.msal_writer_app_role }}
      msal_reader_app_role: ${{ needs.ensure-msal.outputs.msal_reader_app_role }}
      msal_admin_app_role: ${{ needs.ensure-msal.outputs.msal_admin_app_role }}
      msal_allowed_app_ids: ${{ needs.ensure-msal.outputs.msal_allowed_app_ids }}
      # --- Foundry + telemetry + Postgres (forge output wins; discovery is the fallback) ---
      foundry_endpoint: ${{ needs.discover.outputs.foundry_endpoint }}
      foundry_project_url: ${{ needs.forge-deploy.outputs.project_endpoint || needs.discover.outputs.foundry_project_url }}
      app_insights_resource_id: ${{ needs.discover.outputs.app_insights_resource_id }}
      postgres_server_name: ${{ needs.discover.outputs.postgres_server_name }}
      ledgerfield_seed_uri: ${{ needs.discover.outputs.ledgerfield_seed_uri }}
      # --- Fabric / OneLake (chosen names + runtime-computed admin members) ---
      fabric_capacity_name: ${{ needs.discover.outputs.fabric_capacity_name }}
      fabric_sku_name: ${{ needs.discover.outputs.fabric_sku_name }}
      fabric_workspace_name: ${{ needs.discover.outputs.fabric_workspace_name }}
      fabric_workspace: ${{ needs.preflight.outputs.recorded_onelake_workspace }}
      fabric_lakehouse_name: ${{ needs.discover.outputs.fabric_lakehouse_name }}
      fabric_corpus_prefix: ${{ needs.discover.outputs.fabric_corpus_prefix }}
      fabric_account_url: ${{ needs.discover.outputs.fabric_account_url }}
      fabric_administrator_members_json: ${{ needs.discover.outputs.fabric_admin_members_json }}
      # --- Log Analytics (backs the reused App Insights component) ---
      log_analytics_workspace_name: ${{ needs.discover.outputs.log_analytics_workspace_name }}
      log_analytics_resource_group: ${{ needs.discover.outputs.log_analytics_resource_group }}
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_LOCATION: ${{ secrets.AZURE_LOCATION }}
      # Discovered (waypoint app RG) — no longer a manual keystone secret.
      AZURE_RESOURCE_GROUP: ${{ needs.discover.outputs.waypoint_rg }}
      # Generated + stored in Key Vault this run (or read back if pre-existing).
      POSTGRES_APP_PASSWORD: ${{ needs.provision-keyvault.outputs.postgres_app_password }}
      WAYPOINT_API_KEYS: ${{ needs.provision-keyvault.outputs.api_keys }}
      # Cross-repo checkout of waypoint's own source from the keystone caller context.
      REPO_TOKEN: ${{ secrets.KEYSTONE_REPO_TOKEN }}

  # Stage 4 — upload the ledgerfield corpus into the OneLake lakehouse via ledgerfield's
  # reusable onelake-upload workflow. Lake coordinates come from waypoint-deploy when Fabric
  # was provisioned this run, else the recorded workspace GUID (RG tag) + the chosen names.
  ledgerfield-onelake-upload:
    needs: [discover, preflight, waypoint-deploy]
    if: ${{ always() && needs.preflight.outputs.needs_onelake_upload == 'true' && !cancelled() && (needs.waypoint-deploy.result == 'success' || needs.waypoint-deploy.result == 'skipped') && (needs.waypoint-deploy.outputs.onelake_workspace != '' || needs.preflight.outputs.recorded_onelake_workspace != '') }}
    uses: caldova/waypoint/.github/workflows/onelake-upload.yml@main
    with:
      source_ref: ${{ inputs.ledgerfield_ref }}
      workspace: ${{ needs.waypoint-deploy.outputs.onelake_workspace || needs.preflight.outputs.recorded_onelake_workspace }}
      lakehouse: ${{ needs.waypoint-deploy.outputs.onelake_lakehouse || needs.discover.outputs.fabric_lakehouse_name }}
      account_url: ${{ needs.waypoint-deploy.outputs.onelake_account_url || needs.discover.outputs.fabric_account_url }}
      corpus_prefix: ${{ needs.discover.outputs.fabric_corpus_prefix }}
    secrets:
      REPO_TOKEN: ${{ secrets.KEYSTONE_REPO_TOKEN }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  # Stage 4b — seed the contracts-kb Foundry IQ knowledge base by syncing the ledgerfield
  # supplier contracts into the KB's Azure Blob Storage container AND triggering an immediate
  # reindex, via ledgerfield's reusable contracts-kb-upload workflow. This is the AUTHORITATIVE
  # blob sync (uploads current sup-* contracts, deletes stale cmo-* blobs under the prefix) and
  # REPLACES the manual portal seeding. The KB storage/search coordinates come from forge-deploy's
  # outputs (forge OWNS the KB provisioning), falling back to the recorded storage-account RG tag
  # when forge was skipped this run. INDEPENDENT of waypoint/onelake (only needs forge's KB
  # storage), so it runs in PARALLEL with waypoint-deploy. Idempotent self-cleaning blob sync.
  #
  # Reindex is done IN THIS STAGE: the contracts-ks knowledge source's Azure AI Search indexer has
  # a DETERMINISTIC name (`contracts-ks-indexer`, pattern <ks-name>-indexer) with a daily
  # auto-refresh, and ledgerfield's workflow runs it directly after the blob sync when
  # search_endpoint is set. The deploy SP holds Storage Blob Data Contributor + Search
  # Service/Index Data Contributor (granted in Forge bicep), so the same OIDC identity uploads AND
  # reindexes. `indexer` is passed explicitly from forge's output for legibility (the ledgerfield
  # CLI would otherwise default to the same `contracts-ks-indexer`).
  #
  # TODO(confirm-with-forge): the forge deploy-output names below
  # (contracts_kb_storage_account/container/search_endpoint/indexer) are the agreed contract
  # relayed by the coordinating session; confirm against caldova/waypoint@main before relying on
  # them in production. Unknown/empty coordinates simply skip the stage (guarded in `if:`).
  ledgerfield-contracts-kb-upload:
    needs: [discover, preflight, forge-deploy]
    if: ${{ always() && needs.preflight.outputs.needs_contracts_kb == 'true' && !cancelled() && (needs.forge-deploy.result == 'success' || needs.forge-deploy.result == 'skipped') && (needs.forge-deploy.outputs.contracts_kb_storage_account != '' || needs.preflight.outputs.recorded_contracts_kb_storage != '') }}
    uses: caldova/waypoint/.github/workflows/contracts-kb-upload.yml@main
    with:
      source_ref: ${{ inputs.ledgerfield_ref }}
      # Storage account is REQUIRED: forge output wins, else the recorded RG tag (only-mode /
      # forge-skipped). Container defaults to 'knowledge' when forge doesn't emit one.
      storage_account: ${{ needs.forge-deploy.outputs.contracts_kb_storage_account != '' && needs.forge-deploy.outputs.contracts_kb_storage_account || needs.preflight.outputs.recorded_contracts_kb_storage }}
      container: ${{ needs.forge-deploy.outputs.contracts_kb_container != '' && needs.forge-deploy.outputs.contracts_kb_container || 'knowledge' }}
      # search_endpoint drives the immediate post-sync reindex; `indexer` is passed explicitly for
      # legibility (the ledgerfield CLI would otherwise default to `contracts-ks-indexer`). Both
      # come from forge outputs — an EMPTY search_endpoint degrades gracefully in the ledgerfield
      # workflow to "sync only, rely on the daily indexer schedule", so it is intentionally NOT
      # part of the `if:` guard (only the storage account is required).
      search_endpoint: ${{ needs.forge-deploy.outputs.contracts_kb_search_endpoint }}
      indexer: ${{ needs.forge-deploy.outputs.contracts_kb_indexer }}
    secrets:
      REPO_TOKEN: ${{ secrets.KEYSTONE_REPO_TOKEN }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  # Stage 5 — import the deterministic seed into the deployed API. Downloads the stage-1
  # artifact and POSTs it to Waypoint's admin seed endpoint (x-api-key admin from Key Vault).
  # The endpoint is an upsert, so re-running is idempotent. api_fqdn comes from waypoint's
  # output when it deployed this run, else from the recorded keystone_api_fqdn RG tag.
  seed-import:
    needs: [discover, preflight, provision-keyvault, ledgerfield-seed, waypoint-deploy, ledgerfield-onelake-upload]
    if: ${{ always() && needs.preflight.outputs.needs_seed == 'true' && !cancelled() && (needs.waypoint-deploy.result == 'success' || needs.waypoint-deploy.result == 'skipped') && needs.ledgerfield-seed.result == 'success' && (needs.ledgerfield-onelake-upload.result == 'success' || needs.ledgerfield-onelake-upload.result == 'skipped') && needs.provision-keyvault.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download seed artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.ledgerfield-seed.outputs.artifact-name }}
          path: seed
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Import seed into Waypoint
        env:
          API_FQDN: ${{ needs.waypoint-deploy.outputs.api_fqdn }}
          RECORDED_API_FQDN: ${{ needs.preflight.outputs.recorded_api_fqdn }}
          WAYPOINT_RG: ${{ needs.discover.outputs.waypoint_rg }}
          ADMIN_API_KEY: ${{ needs.provision-keyvault.outputs.admin_api_key }}
          KV_NAME: ${{ needs.provision-keyvault.outputs.kv_name }}
          SEED_FILE: seed/data/waypoint/waypoint-seed.json
        run: bash scripts/seed_import.sh

  # Stage 6 — push cross-repo endpoint/config values into forge (idempotent `azd env set`),
  # then run MSAL pass 2: union the deployed web FQDN into the waypoint app's SPA redirect URIs
  # (only knowable AFTER waypoint-deploy; falls back to the recorded web FQDN RG tag on a skip).
  wire:
    needs: [discover, ensure-msal, preflight, forge-deploy, waypoint-deploy, seed-import]
    if: ${{ always() && needs.preflight.outputs.needs_wire == 'true' && !cancelled() && (needs.forge-deploy.result == 'success' || needs.forge-deploy.result == 'skipped') && needs.waypoint-deploy.result == 'success' && (needs.seed-import.result == 'success' || needs.seed-import.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Push forge endpoint/config
        env:
          API_APP_ID_URI: ${{ needs.ensure-msal.outputs.api_app_id_uri }}
          API_DEFAULT_SCOPE: ${{ needs.ensure-msal.outputs.api_default_scope }}
          API_FQDN: ${{ needs.waypoint-deploy.outputs.api_fqdn }}
          # forge emits ONE shared Foundry project endpoint; each hosted agent is reached
          # at <project_endpoint>/agents/<agent-name>. Compose the five per-agent bases.
          FORGE_PROJECT_ENDPOINT: ${{ needs.forge-deploy.outputs.project_endpoint || needs.discover.outputs.foundry_project_url }}
        run: |
          base="${FORGE_PROJECT_ENDPOINT%/}"
          export WORKIQ_ENDPOINT="$base/agents/workiq-expert"
          export WEBIQ_ENDPOINT="$base/agents/webiq-expert"
          export FOUNDRYIQ_ENDPOINT="$base/agents/foundryiq-expert"
          export FABRICIQ_ENDPOINT="$base/agents/fabriciq-expert"
          export AGGREGATOR_ENDPOINT="$base/agents/aggregator"
          scripts/wire.sh
      - name: Update MSAL redirect URI (pass 2)
        if: ${{ needs.waypoint-deploy.outputs.web_fqdn != '' || needs.preflight.outputs.recorded_web_fqdn != '' }}
        env:
          MSAL_CLIENT_ID: ${{ needs.ensure-msal.outputs.msal_client_id }}
          WEB_FQDN: ${{ needs.waypoint-deploy.outputs.web_fqdn || needs.preflight.outputs.recorded_web_fqdn }}
        run: bash scripts/msal.sh redirect

  # Record the resolved state so the NEXT run's preflight can detect "no change" and skip
  # unchanged stages. State is written as AZURE RESOURCE GROUP TAGS on the discovered state RG
  # (the deploy SP has Contributor via OIDC) — NOT GitHub repo variables, which the workflow
  # GITHUB_TOKEN cannot write. Only advances a tag when its stage actually succeeded this run.
  record-state:
    needs: [discover, ensure-msal, preflight, provision-keyvault, ledgerfield-seed, forge-deploy, waypoint-deploy, ledgerfield-onelake-upload, ledgerfield-contracts-kb-upload, seed-import, wire]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Record deployed SHAs + coordinates as RG tags
        env:
          STATE_RG: ${{ needs.discover.outputs.state_rg }}
          KV_NAME: ${{ needs.provision-keyvault.outputs.kv_name }}
          MSAL_CLIENT_ID: ${{ needs.ensure-msal.outputs.msal_client_id }}
          LEDGERFIELD_SHA: ${{ needs.preflight.outputs.ledgerfield_sha }}
          FORGE_SHA: ${{ needs.preflight.outputs.forge_sha }}
          WAYPOINT_SHA: ${{ needs.preflight.outputs.waypoint_sha }}
          ONELAKE_WORKSPACE: ${{ needs.waypoint-deploy.outputs.onelake_workspace }}
          CONTRACTS_KB_STORAGE: ${{ needs.forge-deploy.outputs.contracts_kb_storage_account != '' && needs.forge-deploy.outputs.contracts_kb_storage_account || needs.preflight.outputs.recorded_contracts_kb_storage }}
          API_FQDN: ${{ needs.waypoint-deploy.outputs.api_fqdn }}
          WEB_FQDN: ${{ needs.waypoint-deploy.outputs.web_fqdn }}
          WAYPOINT_RG: ${{ needs.discover.outputs.waypoint_rg }}
          LEDGERFIELD_RESULT: ${{ needs.ledgerfield-seed.result }}
          FORGE_RESULT: ${{ needs.forge-deploy.result }}
          WAYPOINT_RESULT: ${{ needs.waypoint-deploy.result }}
          SEED_RESULT: ${{ needs.seed-import.result }}
          CONTRACTS_KB_RESULT: ${{ needs.ledgerfield-contracts-kb-upload.result }}
        run: |
          set -euo pipefail
          rg="${STATE_RG:?STATE_RG required}"
          args=()
          add() { if [ -n "$2" ]; then args+=("tags.$1=$2"); fi; return 0; }
          # Only advance a recorded SHA when that stage actually succeeded this run.
          [ "$LEDGERFIELD_RESULT" = "success" ] && add keystone_ledgerfield_sha "$LEDGERFIELD_SHA" || true
          [ "$FORGE_RESULT" = "success" ] && add keystone_forge_sha "$FORGE_SHA" || true
          [ "$WAYPOINT_RESULT" = "success" ] && add keystone_waypoint_sha "$WAYPOINT_SHA" || true
          [ "$SEED_RESULT" = "success" ] && add keystone_seed_sha "$LEDGERFIELD_SHA" || true
          # contracts-kb: advance the corpus SHA only when the upload (blob sync + immediate
          # reindex) succeeded. Persist the KB storage account (mirrors keystone_onelake_workspace)
          # so preflight only-mode + skip-on-unchanged can resolve coordinates without forcing a
          # forge redeploy.
          [ "$CONTRACTS_KB_RESULT" = "success" ] && add keystone_contracts_kb_sha "$LEDGERFIELD_SHA" || true
          add keystone_contracts_kb_storage "$CONTRACTS_KB_STORAGE"
          # Coordinates only emit when waypoint deployed this run; keep the existing tag
          # otherwise (don't overwrite with an empty value). Fall back to live discovery
          # when the waypoint-deploy outputs came back empty (job outputs can be flaky).
          if [ -z "$API_FQDN" ] && [ -n "${WAYPOINT_RG:-}" ]; then
            API_FQDN="$(az containerapp show --name api --resource-group "$WAYPOINT_RG" \
              --query properties.configuration.ingress.fqdn -o tsv 2>/dev/null || true)"
          fi
          if [ -z "$WEB_FQDN" ] && [ -n "${WAYPOINT_RG:-}" ]; then
            WEB_FQDN="$(az containerapp show --name web --resource-group "$WAYPOINT_RG" \
              --query properties.configuration.ingress.fqdn -o tsv 2>/dev/null || true)"
          fi
          add keystone_onelake_workspace "$ONELAKE_WORKSPACE"
          add keystone_api_fqdn "$API_FQDN"
          add keystone_web_fqdn "$WEB_FQDN"
          add keystone_msal_client_id "$MSAL_CLIENT_ID"
          add keystone_kv_name "$KV_NAME"
          if [ "${#args[@]}" -gt 0 ]; then
            az group update --name "$rg" --set "${args[@]}" -o none
            echo "recorded: ${args[*]}"
          else
            echo "nothing to record this run"
          fi
