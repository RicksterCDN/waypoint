# Optional. Delete this file if you don't want to publish this agent to
# Microsoft 365 / Teams via CI.
#
# When present and the deploy workflow runs with `publish: true`,
# scripts/publish_agent.py will call the Foundry M365 publish endpoint
# (undocumented internal API — expect breakage).

app_version: "1.0.0"

short_description: "Short one-liner describing this agent."
full_description: |
  A longer description shown in the Microsoft 365 agent store.
  Markdown is supported.

developer_name: "Your Org"
developer_website_url: "https://example.com"
privacy_url: "https://example.com/privacy"
terms_of_use_url: "https://example.com/terms"

# "tenant" = org-wide (requires M365 admin approval at
#   https://admin.cloud.microsoft/#/agents/all/requested ).
# "individual" = just you.
publish_scope: individual

# Set true ONLY for the Agent 365 "digital worker" path.
digital_worker: false
