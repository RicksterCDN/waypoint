# Optional. Delete this file if you don't want to publish this agent to
# Microsoft 365 / Teams via CI.
#
# When present and the deploy workflow runs with `publish: true`,
# scripts/publish_agent.py will call the Foundry M365 publish endpoint
# (undocumented internal API — expect breakage).

app_version: "1.0.2"

short_description: "Invoice assurance digital worker with its own inbox."
full_description: |
  Assurance Orchestrator is an invoice assurance digital worker. Email an
  invoice to its Microsoft 365 inbox and it discovers the matching Waypoint
  work, fans out to the domain evidence experts (WorkIQ / WebIQ / FoundryIQ /
  FabricIQ), reconciles the findings, and prepares correlation metadata plus a
  read-only write plan for human review.

developer_name: "Not A Real Co"
developer_website_url: "https://example.com"
privacy_url: "https://example.com/privacy"
terms_of_use_url: "https://example.com/terms"

# "tenant" = org-wide (requires M365 admin approval at
#   https://admin.cloud.microsoft/#/agents/all/requested ).
# "shared" = shared with a team. "personal" = just you.
publish_scope: personal

# Set true for the Agent 365 "digital worker" path. This provisions the
# teammate's own Microsoft 365 identity + inbox so invoices can be emailed to
# it, and routes Teams traffic through the blueprint bot id (see
# scripts/publish_agent.py + docs/AI_TEAMMATE.md).
digital_worker: true
