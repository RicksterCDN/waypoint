[project]
name = "my-agent"
version = "0.1.0"
description = "Template hosted agent for Microsoft Foundry — copy and rename."
requires-python = ">=3.12"
dependencies = [
    # List sub-packages directly to avoid the broken agent-framework meta-package
    # transitive dep on agent-framework-durabletask. Remove --no-deps workaround
    # once upstream fixes agent-framework-durabletask.
    "agent-framework-core==1.4.0",
    "agent-framework-foundry==1.4.0",
    "agent-framework-foundry-hosting==1.0.0a260514",
    # Pin the matched Foundry hosting runtime pair (same as agents/eliza).
    "azure-ai-agentserver-responses==1.0.0b5",
    "azure-ai-agentserver-core==2.0.0b3",
    "azure-identity",
    "httpx",
    "python-dotenv",
    "opentelemetry-api>=1.25,<2",
    # Required by MCPStreamableHTTPTool (toolbox MCP client).
    "mcp",
    # Microsoft 365 Agents SDK — powers /api/messages for AI Teammate hires.
    "microsoft-agents-activity",
    "microsoft-agents-hosting-core",
    "microsoft-agents-hosting-fastapi",
    "microsoft-agents-authentication-msal",
    # Guard against pydantic alpha resolver picks.
    "pydantic>=2.11,<2.14",
    # Local VS Code debugpy support.
    "debugpy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/my_agent"]

[tool.uv]
# Required to resolve azure-ai-agentserver-* beta and agent-framework pre-release packages.
prerelease = "allow"
