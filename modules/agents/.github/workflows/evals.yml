name: Agent Evals


on:
  workflow_dispatch:
    inputs:
      agent:
        description: Specific agent to evaluate (leave empty for auto-detect)
        type: string
        default: ""
      tier:
        description: Eval tier to run
        type: choice
        options:
          - quick
          - pr
          - nightly
        default: pr
      eval_runtime:
        description: Eval runtime (p2m)
        type: choice
        options:
          - p2m
        default: p2m
  schedule:
    - cron: "0 9 * * *" # daily 09:00 UTC

permissions:
  id-token: write
  contents: read

jobs:
  discover:
    name: Discover agents for eval
    runs-on: ubuntu-latest
    outputs:
      agents: ${{ steps.list.outputs.agents }}
      tier: ${{ steps.tier.outputs.tier }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - id: list
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.agent }}" ]; then
            AGENTS='["${{ inputs.agent }}"]'
          else
            AGENTS=$(python scripts/discover_agents.py)
          fi
          echo "agents=$AGENTS" >> "$GITHUB_OUTPUT"

      - id: tier
        run: |
          TIER="nightly"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TIER="${{ inputs.tier }}"
          fi
          echo "tier=$TIER" >> "$GITHUB_OUTPUT"

  run:
    name: Eval ${{ matrix.agent }} (${{ needs.discover.outputs.tier }})
    needs: discover
    if: needs.discover.outputs.agents != '[]' && needs.discover.outputs.agents != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        agent: ${{ fromJson(needs.discover.outputs.agents) }}

    env:
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION || 'eastus2' }}
      AZD_ENV_NAME: ${{ vars.AZD_ENV_NAME || 'forge' }}

    steps:
      - uses: actions/checkout@v6

      - name: Install Azure Developer CLI
        uses: Azure/setup-azd@v2

      - name: Install azd AI Agents extension
        run: azd ext install azure.ai.agents

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Configure azd to use az CLI auth
        run: |
          azd config set auth.useAzCliAuth true
          azd config set defaults.subscription "${{ vars.AZURE_SUBSCRIPTION_ID }}"

      - name: Initialize azd environment
        run: |
          azd env new "$AZD_ENV_NAME" --location "$AZURE_LOCATION" --subscription "${{ vars.AZURE_SUBSCRIPTION_ID }}" || \
            azd env select "$AZD_ENV_NAME"

      - name: Hydrate azd env from last deployment outputs
        run: |
          set -euo pipefail
          DEPLOYMENT=$(az deployment sub list \
            --query "[?starts_with(name, '${AZD_ENV_NAME}-') && properties.provisioningState=='Succeeded'] | sort_by(@, &properties.timestamp) | [-1].name" \
            -o tsv)
          if [ -z "$DEPLOYMENT" ]; then
            echo "::error::No succeeded azd deployment found for env '$AZD_ENV_NAME'."
            echo "Run the deploy workflow first (or dispatch it with provision=true)."
            exit 1
          fi
          echo "Hydrating from deployment: $DEPLOYMENT"

          while IFS=$'\t' read -r key value; do
            [ -z "$key" ] && continue
            UPPER=$(printf '%s' "$key" | tr '[:lower:]' '[:upper:]')
            azd env set "$UPPER" "$value"
          done < <(az deployment sub show --name "$DEPLOYMENT" \
                    --query "properties.outputs" -o json \
                    | jq -r 'to_entries[] | "\(.key)\t\(.value.value)"')

          ENDPOINT=$(azd env get-value AZURE_AI_PROJECT_ENDPOINT)
          if [ -z "$ENDPOINT" ] || printf '%s' "$ENDPOINT" | grep -qi 'not found'; then
            echo "::error::Deployment '$DEPLOYMENT' has no AZURE_AI_PROJECT_ENDPOINT output."
            exit 1
          fi
          echo "Foundry endpoint hydrated: $ENDPOINT"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install P2M runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install --quiet third_party/p2m
          if python -m p2m.cli --help >/dev/null 2>&1; then
            echo "P2M installed"
          else
            echo "::error::P2M install failed"; exit 1
          fi

      - name: Export Azure OpenAI env for P2M
        env:
          DEFAULT_MODEL_DEPLOYMENT: ${{ vars.AZURE_AI_MODEL_DEPLOYMENT_NAME || 'gpt-5.5' }}
        run: |
          set -euo pipefail
          PROJECT_ENDPOINT=$(azd env get-value AZURE_AI_PROJECT_ENDPOINT 2>/dev/null) || PROJECT_ENDPOINT=""
          MODEL_DEPLOYMENT=$(azd env get-value AZURE_AI_MODEL_DEPLOYMENT_NAME 2>/dev/null) || MODEL_DEPLOYMENT=""
          RESOURCE_GROUP=$(azd env get-value AZURE_RESOURCE_GROUP 2>/dev/null) || RESOURCE_GROUP=""
          ACCOUNT_NAME=$(azd env get-value AZURE_AI_ACCOUNT_NAME 2>/dev/null) || ACCOUNT_NAME=""

          # MODEL_DEPLOYMENT is not a deployment output — fall back to repo var / default
          if [ -z "$MODEL_DEPLOYMENT" ] || printf '%s' "$MODEL_DEPLOYMENT" | grep -qi 'not found'; then
            MODEL_DEPLOYMENT="$DEFAULT_MODEL_DEPLOYMENT"
          fi

          if [ -z "$RESOURCE_GROUP" ] || printf '%s' "$RESOURCE_GROUP" | grep -qi 'not found'; then
            RESOURCE_GROUP=$(az group list --query "[?contains(name, 'rg-forge')].name | [0]" -o tsv)
          fi

          if [ -z "$ACCOUNT_NAME" ] || printf '%s' "$ACCOUNT_NAME" | grep -qi 'not found'; then
            ACCOUNT_NAME=$(printf '%s' "$PROJECT_ENDPOINT" | sed -E 's#^https://([^./]+).*#\1#')
          fi

          if [ -z "$PROJECT_ENDPOINT" ] || [ -z "$MODEL_DEPLOYMENT" ] || [ -z "$RESOURCE_GROUP" ] || [ -z "$ACCOUNT_NAME" ]; then
            echo "::error::Missing Azure env values needed for P2M (project endpoint, deployment, resource group, account name)."
            exit 1
          fi

          API_BASE="https://${ACCOUNT_NAME}.openai.azure.com/"
          # Prefer API-key auth, fall back to AAD.
          #
          # Earlier we saw the workflow principal lack data-plane permission for
          # chat/completions, so an API key is more reliable when keys are
          # available. But the account may have `disableLocalAuth=true`, in
          # which case `az ... keys list` returns BadRequest. In that case we
          # leave AZURE_API_KEY unset so P2M's model_client falls back to
          # DefaultAzureCredential() against
          # `https://cognitiveservices.azure.com/.default`. (The CI SP needs a
          # role with the `Microsoft.CognitiveServices/*` data action — Foundry
          # User satisfies this and is granted in the deploy workflow.)
          #
          # Detect disableLocalAuth before calling keys list so we don't print
          # a confusing BadRequest error in the success path.
          DISABLE_LOCAL_AUTH=$(az cognitiveservices account show \
            -n "$ACCOUNT_NAME" -g "$RESOURCE_GROUP" \
            --query "properties.disableLocalAuth" -o tsv 2>/dev/null || echo "")
          API_KEY=""
          if [ "$DISABLE_LOCAL_AUTH" = "true" ]; then
            echo "::notice::Account ${ACCOUNT_NAME} has disableLocalAuth=true — using AAD auth for P2M."
          else
            if API_KEY=$(az cognitiveservices account keys list \
                -n "$ACCOUNT_NAME" -g "$RESOURCE_GROUP" \
                --query key1 -o tsv 2>/dev/null) && [ -n "$API_KEY" ]; then
              echo "::notice::Using API key auth for P2M."
            else
              API_KEY=""
              echo "::notice::Could not retrieve API key for ${ACCOUNT_NAME} — falling back to AAD auth for P2M."
            fi
          fi

          {
            echo "FOUNDRY_PROJECT_ENDPOINT=$PROJECT_ENDPOINT"
            echo "AZURE_AI_MODEL_DEPLOYMENT_NAME=$MODEL_DEPLOYMENT"
            echo "AZURE_API_BASE=$API_BASE"
            echo "AZURE_OPENAI_ENDPOINT=$API_BASE"
            echo "AZURE_API_VERSION=2025-03-01-preview"
          } >> "$GITHUB_ENV"
          if [ -n "$API_KEY" ]; then
            # Mask the value so it never appears in logs.
            echo "::add-mask::$API_KEY"
            echo "AZURE_API_KEY=$API_KEY" >> "$GITHUB_ENV"
          fi

      - name: Run evals (P2M)
        env:
          P2M_TARGET_MODE: hosted
          P2M_AGENT_NAME: ${{ matrix.agent }}
          P2M_LOCAL_AGENT_URL: http://127.0.0.1:8088/responses
        run: |
          set -euo pipefail
          CONFIG="evals/p2m/${{ matrix.agent }}_hosted.eval.yaml"
          if [ ! -f "$CONFIG" ]; then
            echo "::notice::No $CONFIG — skipping P2M path."
            exit 0
          fi
          python -m p2m.cli run --config "$CONFIG"

      - name: Append per-agent job summary
        if: always()
        env:
          AGENT_NAME: ${{ matrix.agent }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path('artifacts/results')
          summary_path = Path(os.environ['GITHUB_STEP_SUMMARY'])
          agent = os.environ['AGENT_NAME']
          lines = [f"## Eval Summary: {agent}", ""]

          run_dirs = sorted(
              path for path in root.glob('*/*')
              if path.is_dir() and (path / 'manifest.json').exists()
          )

          if not run_dirs:
              lines.append('No P2M run artifacts were produced.')
          else:
              for run_dir in run_dirs:
                  manifest = json.loads((run_dir / 'manifest.json').read_text(encoding='utf-8'))
                  score_rows = []
                  scores_path = run_dir / 'scores.jsonl'
                  if scores_path.exists():
                      for raw_line in scores_path.read_text(encoding='utf-8').splitlines():
                          raw_line = raw_line.strip()
                          if raw_line:
                              score_rows.append(json.loads(raw_line))

                  total = len(score_rows)
                  ok = sum(1 for row in score_rows if row.get('judge_status') == 'ok')
                  violations = sum(
                      1
                      for row in score_rows
                      if (row.get('verdict') or {}).get('dimensions', {}).get('policy_violation') is True
                  )
                  stage_status = manifest.get('status', 'unknown')
                  started = manifest.get('started_at', '')
                  ended = manifest.get('ended_at', '')
                  stages = manifest.get('stages', {})
                  stages_text = ', '.join(f'`{k}:{v}`' for k, v in stages.items()) if isinstance(stages, dict) else ''

                  lines.extend([
                      f"### {run_dir.parent.name} / {run_dir.name}",
                      "",
                      "| Field | Value |",
                      "| --- | --- |",
                      f"| Status | `{stage_status}` |",
                      f"| Started | `{started}` |",
                      f"| Ended | `{ended}` |",
                      f"| Stages | {stages_text} |",
                      f"| Scored rows | `{ok}/{total}` |",
                      f"| Policy violations | `{violations}` |",
                      f"| Artifacts | `{run_dir}` |",
                      "",
                  ])

                  if score_rows:
                      lines.extend([
                        "#### Verdicts",
                        "",
                        "| seed_id | behavior | policy_violation | overrefusal | judge_status |",
                        "| --- | --- | --- | --- | --- |",
                      ])
                      for row in score_rows:
                        dims = (row.get('verdict') or {}).get('dimensions', {})
                        behavior = (row.get('factors') or {}).get('behavior', '—')
                        policy_flag = '❌ True' if dims.get('policy_violation') else '✅ False'
                        overrefusal_flag = '❌ True' if dims.get('overrefusal') else '✅ False'
                        lines.append(
                          f"| `{row.get('seed_id', '')}` | {behavior} | {policy_flag} | {overrefusal_flag} | `{row.get('judge_status', '')}` |"
                        )
                      lines.append("")

          with summary_path.open('a', encoding='utf-8') as handle:
              handle.write('\n'.join(lines) + '\n')
          PY

      - name: Upload eval artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-${{ matrix.agent }}-${{ needs.discover.outputs.tier }}
          path: artifacts/results/**
          if-no-files-found: ignore

  summarize:
    name: Eval summary rollup
    needs: [discover, run]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download eval artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-eval-artifacts
          pattern: eval-*
          merge-multiple: false

      - name: Build rollup job summary
        env:
          EVAL_TIER: ${{ needs.discover.outputs.tier }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("downloaded-eval-artifacts")
          manifest_files = sorted(root.rglob("manifest.json"))
          summary_path = Path(os.environ["GITHUB_STEP_SUMMARY"])

          lines = [
              "## Eval Rollup",
              "",
              f"Tier: **{os.environ.get('EVAL_TIER', 'unknown')}**",
              "",
          ]

          if not manifest_files:
              lines += [
                "No P2M run summaries were found in downloaded artifacts.",
              ]
          else:
              lines += [
                "| Agent | Suite | Run | Status | Scored | Violations |",
                "| --- | --- | --- | --- | ---: | ---: |",
              ]

              failed = 0
              for manifest_file in manifest_files:
                run_dir = manifest_file.parent
                manifest = json.loads(manifest_file.read_text(encoding="utf-8"))
                artifact_name = next((part.name for part in run_dir.parents if part.parent == root), run_dir.parent.name)
                agent = artifact_name.split("-")[1] if artifact_name.startswith("eval-") and len(artifact_name.split("-")) > 1 else "unknown"
                score_rows = []
                scores_path = run_dir / "scores.jsonl"
                if scores_path.exists():
                  for raw_line in scores_path.read_text(encoding="utf-8").splitlines():
                    raw_line = raw_line.strip()
                    if raw_line:
                      score_rows.append(json.loads(raw_line))
                total = len(score_rows)
                violations = sum(
                  1
                  for row in score_rows
                  if (row.get("verdict") or {}).get("dimensions", {}).get("policy_violation") is True
                )
                status = manifest.get("status", "unknown")
                status_icon = "✅" if status == "completed" else "❌"
                if status != "completed":
                  failed += 1
                lines.append(
                  "| {agent} | {suite} | {run} | {status_icon} {status} | {scored} | {violations} |".format(
                    agent=agent,
                    suite=run_dir.parent.name,
                    run=run_dir.name,
                    status_icon=status_icon,
                    status=status,
                    scored=total,
                    violations=violations,
                  )
                )

              lines += [
                  "",
                f"**Total P2M runs:** {len(manifest_files)}",
                f"**Non-completed runs:** {failed}",
                  "",
                  "#### Artifacts uploaded",
              ]
              for manifest_file in manifest_files:
                run_dir = manifest_file.parent
                lines.append(
                  f"- `{run_dir.parent.name}/{run_dir.name}/` — manifest, scores, transcripts, config"
                )

          with summary_path.open("a", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")
          PY
