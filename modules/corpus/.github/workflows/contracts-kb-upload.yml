name: Contracts KB Upload

# Idempotently seeds the Foundry IQ knowledge base ``contracts-kb`` by syncing the supplier
# contract corpus into the Azure Blob Storage container that its knowledge source ``contracts-ks``
# indexes, then (optionally) triggers the Azure AI Search indexer so the index reflects the new
# blobs immediately. Exposed as a reusable ``workflow_call`` stage so the keystone umbrella can
# invoke it after the forge deploy provisions the search + storage + knowledge base, passing the
# resolved storage/search coordinates from the forge deploy outputs. Also runnable manually via
# ``workflow_dispatch``. Authenticates to Azure with OIDC (DefaultAzureCredential picks up the
# federated token); the deploy identity must have Storage Blob Data Contributor on the container
# and (for reindex) Search Service Contributor on the search service.

on:
  workflow_call:
    inputs:
      source_ref:
        description: Git ref of THIS (ledgerfield) repo to check out. The keystone umbrella passes its ledgerfield_ref; defaults to the triggering ref for standalone runs.
        required: false
        type: string
        default: ""
      storage_account:
        description: Storage account name backing the contracts-ks knowledge source.
        required: true
        type: string
      container:
        description: Blob container indexed by contracts-ks.
        required: false
        type: string
        default: "knowledge"
      prefix:
        description: Blob name prefix (virtual folder) for contract documents.
        required: false
        type: string
        default: "contracts"
      include_policies:
        description: Also upload policy source documents alongside contracts.
        required: false
        type: boolean
        default: false
      search_endpoint:
        description: Azure AI Search endpoint (https://<svc>.search.windows.net) to trigger a reindex. Leave blank to rely on the indexer schedule.
        required: false
        type: string
        default: ""
      indexer:
        description: Azure AI Search indexer name to run after upload. Leave blank to use the deterministic default (contracts-ks-indexer); the reindex only runs when search_endpoint is set.
        required: false
        type: string
        default: ""
    secrets:
      REPO_TOKEN:
        description: Token with contents:read on this repo so a cross-repo caller (keystone umbrella) can check out ledgerfield's own source. Falls back to GITHUB_TOKEN for standalone runs.
        required: false
      AZURE_CLIENT_ID:
        description: Client ID of the OIDC deploy identity.
        required: true
      AZURE_TENANT_ID:
        description: Azure AD tenant ID.
        required: true
      AZURE_SUBSCRIPTION_ID:
        description: Azure subscription ID.
        required: true
  workflow_dispatch:
    inputs:
      storage_account:
        description: Storage account name backing the contracts-ks knowledge source.
        required: true
        type: string
      container:
        description: Blob container indexed by contracts-ks.
        required: false
        type: string
        default: "knowledge"
      prefix:
        description: Blob name prefix (virtual folder) for contract documents.
        required: false
        type: string
        default: "contracts"
      include_policies:
        description: Also upload policy source documents alongside contracts.
        required: false
        type: boolean
        default: false
      search_endpoint:
        description: Azure AI Search endpoint to trigger a reindex. Leave blank to rely on the indexer schedule.
        required: false
        type: string
        default: ""
      indexer:
        description: Azure AI Search indexer name to run after upload. Leave blank to use the deterministic default (contracts-ks-indexer); the reindex only runs when search_endpoint is set.
        required: false
        type: string
        default: ""

permissions:
  id-token: write
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: caldova/waypoint
          ref: ${{ inputs.source_ref || github.ref }}
          token: ${{ secrets.REPO_TOKEN || github.token }}

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Sync dependencies
        run: uv sync

      - name: Azure login (OIDC)
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sync contracts into contracts-kb
        run: |
          uv run ledgerfield upload-contracts-kb \
            --storage-account "${{ inputs.storage_account }}" \
            --container "${{ inputs.container }}" \
            --prefix "${{ inputs.prefix }}" \
            ${{ inputs.include_policies && '--include-policies' || '' }} \
            ${{ inputs.search_endpoint != '' && format('--search-endpoint "{0}"', inputs.search_endpoint) || '' }} \
            ${{ inputs.indexer != '' && format('--indexer "{0}"', inputs.indexer) || '' }}
