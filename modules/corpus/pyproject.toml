[project]
name = "ledgerfield"
version = "0.1.0"
description = "Demo data, invoice PDF generation, and Postgres seeding tools for the Waypoint invoice assurance story."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "azure-identity>=1.19.0",
  "azure-storage-blob>=12.23.0",
  "azure-storage-file-datalake>=12.17.0",
  "deltalake>=0.22.0",
  "fastapi>=0.115.0",
  "jinja2>=3.1.0",
  "playwright>=1.49.0",
  "psycopg[binary]>=3.2.0",
  "pyarrow>=18.0.0",
  "python-docx>=1.1.0",
  "uvicorn[standard]>=0.32.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ledgerfield = ["templates/**/*.j2"]

[project.scripts]
ledgerfield = "ledgerfield.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
